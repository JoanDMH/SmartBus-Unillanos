services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: smartbus
      POSTGRES_PASSWORD: smartbus123
      POSTGRES_DB: smartbus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbus"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000

  trip-log:
    build: ./trip-log-service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartbus:smartbus123@postgres:5432/smartbus
      - JWT_SECRET=THIS_IS_A_DEMO_KEY_CHANGE_IT_123456789
      - JWT_ISSUER=MiniIdentityApi
      - JWT_AUDIENCE=MiniIdentityApiUsers
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - OPENWEATHER_CITY=${OPENWEATHER_CITY:-Villavicencio,CO}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_MODEL_CONTAINER=${AZURE_MODEL_CONTAINER:-smartbus-models}
      - OPTIMIZATION_SERVICE_URL=http://optimization-service:8001

  optimization-service:
    build: ./optimization-service
    ports:
      - "8001:8001"
    depends_on:
      - trip-log
    environment:
      - PORT=8001

  ai-engine:
    build: ./ai-engine
    # Servicio batch — no expone puerto propio.
    # Arrancar manualmente: docker compose --profile training run --rm ai-engine python train_prophet.py
    profiles:
      - training
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartbus:smartbus123@postgres:5432/smartbus
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_MODEL_CONTAINER=${AZURE_MODEL_CONTAINER:-smartbus-models}
      - MLFLOW_TRACKING_URI=./mlruns
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai-engine/mlruns:/app/mlruns

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - auth
      - trip-log
      - optimization-service

volumes:
  postgres_data:
